<body>

<table width="100%">
 <tr valign="top">
  <td width="49.7%"> <!-- peerek listája bal oldalon -->

  </td>
  <td width="*" rowspan="2"></td>
  <td width="49.7%"> <!-- peerek listája jobb oldalon -->

  </td>
 </tr>
 <tr valign="top">
  <td> <!-- fájlok listája bal oldalon -->
   <div id="file-list-left"></div>
   <div id="kep_megjelenitese-left"></div>
  </td>
  <td> <!-- fájlok listája jobb oldalon -->
   <div id="file-list-right"></div>
   <div id="kep_megjelenitese-right"></div>
  </td>
 </tr>
</table>

<script type="text/javascript">
bejelentkezes(function(){
  Kapcsolatok.selectedPeer = {
    left: sajat_id,
    right: sajat_id
  };
  Fajlkezelo.mappatartalom_lekerdez_local("", "left");
  Fajlkezelo.mappatartalom_lekerdez_local("", "right");
  Kapcsolatok.kapcsolatok_periodikus_frissitese();
  Kapcsolatok.uzenetek_periodikus_olvasasa();
});
</script>
